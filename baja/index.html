<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <title>Ciudades(In)Posibles</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0b0b0c;
      color: #f3ead8;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 40rem; }
    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 600;
      letter-spacing: .04em;
      opacity: .7;
    }
    p {
      margin: 0 0 2rem;
      font-size: clamp(1.5rem, 5vw, 2.75rem);
      line-height: 1.2;
      font-weight: 600;
    }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
    a {
      display: block;
      padding: .9rem 1rem;
      border: 1px solid rgba(243, 234, 216, .35);
      border-radius: 8px;
      color: #f3ead8;
      font-family: ui-monospace, "IBM Plex Mono", Menlo, monospace;
      font-size: clamp(.95rem, 2.6vw, 1.5rem);
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    a:hover, a:focus-visible { border-color: #f3ead8; background: rgba(243, 234, 216, .08); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>Ciudades(In)Posibles</h1>
    <p>El Visor y la Consola ahora viven dentro del Transmisor.</p>
    <ul>
      <li><a href="https://transmisor.ciudadesinposibles.net/visor">https://transmisor.ciudadesinposibles.net/visor</a></li>
      <li><a href="https://transmisor.ciudadesinposibles.net/consola">https://transmisor.ciudadesinposibles.net/consola</a></li>
    </ul>
  </main>
</body>
</html>
